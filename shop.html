
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170b2d">
  <meta name="description" content="Магазинчик ТокКоинов — каталог призов проекта Аватарский KlipTok.">
  <title>Магазин | ТокКоины</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html" aria-label="Аватарский KlipTok — главная">
    <img src="images/tokcoin.png" alt="" class="brand-coin">
    <span>Аватарский KlipTok</span>
  </a>

  <nav class="main-nav" aria-label="Главное меню">
    <a href="index.html">Главная</a>
    <a href="earn.html">ТокКоины</a>
    <a href="shop.html" aria-current="page">Магазин</a>
    <a href="winners.html">Архив победителей</a>
    <a href="promo.html">Промокоды</a>
    <a href="faq.html">FAQ</a>
  </nav>
</header>

<main>
<section class="section section-alt" id="shop">

  <div class="section-heading">
    <span class="eyebrow">ОБМЕНИВАЙ НАКОПЛЕННОЕ</span>
    <h2>Магазинчик</h2>
    <p>Выбирай призы и копи ТокКоины на то, что нравится.</p>
  </div>

  <div class="catalog-tools">

    <label class="search-wrap">
      <span>⌕</span>
      <input
        aria-label="Поиск по названию товара"
        id="productSearch"
        placeholder="Поиск по названию товара…"
        type="search">
    </label>

    <label class="sort-wrap">
      <span>Сортировка</span>
      <select aria-label="Сортировка товаров" id="productSort">
        <option value="default">По умолчанию</option>
        <option value="asc">Сначала дешевле</option>
        <option value="desc">Сначала дороже</option>
        <option value="name">По алфавиту</option>
      </select>
    </label>

  </div>

  <div class="product-grid" id="productGrid"></div>

  <p class="empty-state" hidden id="emptyProducts">
    Ничего не найдено. Попробуй изменить запрос.
  </p>

</section>
</main>

<footer class="footer">

  <div class="footer-socials">

    <!-- TikTok -->
    <a href="https://www.tiktok.com/@avataria.game"
       target="_blank"
       rel="noopener noreferrer"
       class="social-link"
       aria-label="TikTok">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M19.6 7.2c-1.7-.1-3.2-1.2-3.8-2.8-.2-.5-.3-1-.3-1.6h-3.6v14.1c0 1.2-1 2.2-2.2 2.2s-2.2-1-2.2-2.2 1-2.2 2.2-2.2c.3 0 .6.1.9.2v-3.7c-.3 0-.6-.1-.9-.1-3.2 0-5.8 2.6-5.8 5.8s2.6 5.8 5.8 5.8 5.8-2.6 5.8-5.8V9.5c1.2.9 2.6 1.4 4.1 1.4V7.3c0 0 0 0 0-.1z"/>
      </svg>
    </a>

    <!-- ВКонтакте -->
    <a href="https://vk.ru/clips/avataryaclub"
       target="_blank"
       rel="noopener noreferrer"
       class="social-link"
       aria-label="ВКонтакте">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3.5 7.2h3.2c.2 0 .4.1.5.3.9 2.2 2 3.8 2.7 3.8.3 0 .4-.2.4-.8V7.7c0-.4-.2-.6-.7-.7V5.8h4.9v1.1c-.4.1-.6.3-.6.7v3.1c0 .4.1.6.4.6.7 0 2-1.7 2.9-3.8.1-.2.3-.3.5-.3h3.1c.4 0 .6.3.4.7-.5 1.3-1.5 2.9-2.8 4.3-.2.2-.2.5 0 .7 1.1 1 2.4 2.4 3.1 3.8.2.4 0 .7-.4.7h-3.5c-.2 0-.4-.1-.5-.3-.7-1.1-1.7-2.3-2.5-2.3-.4 0-.6.3-.6.9v1.1c0 .4-.2.6-.6.6h-1.4c-3.8 0-6.4-2.6-8.2-7.1-.2-.4-.3-.8-.3-1.1 0-.3.2-.5.5-.5z"/>
      </svg>
    </a>

    <!-- TGC -->
    <a href="https://tortuga.games/tgc?ysclid=mwnvs6chn5732222744"
       target="_blank"
       rel="noopener noreferrer"
       class="social-link"
       aria-label="TGC">
      <span class="social-letter">TGC</span>
    </a>

  </div>

  <img src="images/tokcoin.png" alt="" class="footer-coin">
  <p>Будь в тренде!</p>
  <span>Аватарский KlipTok</span>

</footer>

<script src="script.js"></script>
</body>
</html>
